        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center gap-3 transform transition-all duration-300 translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800'}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-lg' : type === 'error' ? 'fa-triangle-exclamation text-lg' : 'fa-circle-info text-lg'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function addToCart(productId) {
            const state = getState();
            const prod = state.products.find(p => p.id === productId);
            if (!prod) return;

            const existing = cart.find(i => i.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            showToast(`Berhasil menambahkan "${prod.name}" ke keranjang`, 'success');
            render();
        }

            openCartModal();
            render();

        function proceedCheckout() {
            if (cart.length === 0) return;
            const name = document.getElementById('checkoutName').value.trim();
            const phone = document.getElementById('checkoutPhone').value.trim();

            if (!name || !phone) {
                showToast('Mohon masukkan nama dan nomor WhatsApp Anda!', 'error');
                return;
            }

            const state = getState();
            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const itemsCopy = [...cart];
            const customerCode = 'CUST-' + Math.floor(100 + Math.random() * 900);

            // Save customer if not exists
            state.customers.push({
                code: customerCode,
                name: name,
                phone: phone,
                email: '-',
                registeredAt: new Date().toISOString().split('T')[0]
            });

            const newOrder = {
                id: orderId,
                customerCode: customerCode,
                customerName: name,
                phone: phone,
                items: itemsCopy,
                total: total,
                status: 'Baru Masuk',
                estCompletion: '1-2 Hari Kerja',
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                adminNotes: 'Pesanan masuk otomatis dari katalog.'
            };

            state.orders.unshift(newOrder);

            const invoiceNo = 'INV-' + Math.floor(8000 + Math.random() * 1999);
            state.invoices.unshift({
                invoiceNo: invoiceNo,
                orderId: orderId,
                customerCode: customerCode,
                customerName: name,
                items: itemsCopy,
                total: total,
                status: 'Belum Lunas',
                notes: 'Nota otomatis Fatin Art Advertising.',
                date: new Date().toISOString().split('T')[0]
            });

            saveState(state);

            let itemsText = itemsCopy.map(i => `- ${i.name} (${i.qty}x @${formatRupiah(i.price)})`).join('%0A');
            let waMessage = `Halo Admin Fatin Art Advertising,%0A%0ASaya ingin memesan produk berikut:%0A*Nama:* ${name}%0A*No HP:* ${phone}%0A*ID Pesanan:* ${orderId}%0A%0A*Rincian Pesanan:*%0A${itemsText}%0A%0A*Total:* ${formatRupiah(total)}%0A%0AMohon konfirmasi dan proses pesanan saya. Terima kasih!`;

            cart = [];
            closeModal('cartModal');
            showToast('Pesanan berhasil dibuat!', 'success');
            render();

            window.open(`https://wa.me/${ADMIN_WA}?text=${waMessage}`, '_blank');
        }

                                <select id="prodCat" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <option>Banner</option>
                                    <option>Undangan</option>
                                    <option>Stempel</option>
                                    <option>Nota</option>
                                    <option>Sablon</option>
                                    <option>Yasin</option>
                                    <option>Stiker</option>
                                    <option>Foto</option>
                                    <option>Undangan Seri</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Harga (Rp)</label>
                                <input type="number" id="prodPrice" required placeholder="25000" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">URL Gambar Produk</label>
                                <input type="url" id="prodImg" required placeholder="https://placehold.co/600x400/e05638/ffffff?text=Produk" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Deskripsi Singkat</label>
                                <textarea id="prodDesc" rows="3" required placeholder="Deskripsi bahan dan kualitas..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30">Simpan Produk Baru</button>
                        </form>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div);
        }

        function saveNewProduct(e) {
            e.preventDefault();
            const state = getState();
            state.products.push({
                id: 'p-' + Date.now(),
                name: document.getElementById('prodName').value,
                category: document.getElementById('prodCat').value,
                price: Number(document.getElementById('prodPrice').value),
                img: document.getElementById('prodImg').value,
                desc: document.getElementById('prodDesc').value
            });
            saveState(state);
            closeModal('productModal');
            showToast('Produk katalog berhasil ditambahkan!', 'success');
            render();
        }

        function openEditProductModal(id) {
            const state = getState();
            const p = state.products.find(item => item.id === id);
            if (!p) return;

            const modalHTML = `
                <div id="productModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                            <h3 class="font-bold text-slate-900 text-base">Edit Produk & Gambar Katalog</h3>
                            <button onclick="closeModal('productModal')" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="updateProduct(event, '${p.id}')" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Produk</label>
                                <input type="text" id="editProdName" required value="${p.name}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kategori</label>
                                <input type="text" id="editProdCat" required value="${p.category}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Harga (Rp)</label>
                                <input type="number" id="editProdPrice" required value="${p.price}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ganti URL Gambar</label>
                                <input type="url" id="editProdImg" required value="${p.img}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Deskripsi</label>
                                <textarea id="editProdDesc" rows="3" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">${p.desc}</textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30">Perbarui Katalog</button>
                        </form>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div);
        }

        function updateProduct(e, id) {
            e.preventDefault();
            const state = getState();
            const p = state.products.find(item => item.id === id);
            if (p) {
                p.name = document.getElementById('editProdName').value;
                p.category = document.getElementById('editProdCat').value;
                p.price = Number(document.getElementById('editProdPrice').value);
                p.img = document.getElementById('editProdImg').value;
                p.desc = document.getElementById('editProdDesc').value;
                saveState(state);
                closeModal('productModal');
                showToast('Katalog produk berhasil diperbarui!', 'success');
                render();
            }
        }

        function deleteProduct(id) {
            if (confirm('Yakin ingin menghapus produk ini dari katalog?')) {
                const state = getState();
                state.products = state.products.filter(p => p.id !== id);
                saveState(state);
                showToast('Produk dihapus', 'info');
                render();
            }
        }

        function updateOrderStatus(orderId, newStatus) {
            const state = getState();
            const ord = state.orders.find(o => o.id === orderId);
            if (ord) {
                ord.status = newStatus;
                saveState(state);
                showToast(`Status pesanan ${orderId} diubah ke ${newStatus}`, 'success');
                render();
            }
        }

        function deleteOrder(orderId) {
            if (confirm('Hapus pesanan ini?')) {
                const state = getState();
                state.orders = state.orders.filter(o => o.id !== orderId);
                saveState(state);
                showToast('Pesanan dihapus', 'info');
                render();
            }
        }

        function deleteInvoice(invoiceNo) {
            if (confirm('Hapus nota ini?')) {
                const state = getState();
                state.invoices = state.invoices.filter(i => i.invoiceNo !== invoiceNo);
                saveState(state);
                showToast('Nota dihapus', 'info');
                render();
            }
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
