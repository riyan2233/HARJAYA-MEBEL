        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center gap-3 transform transition-all duration-300 translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800'}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-lg' : type === 'error' ? 'fa-triangle-exclamation text-lg' : 'fa-circle-info text-lg'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const remember = document.getElementById('rememberMe').checked;

            const state = getState();
            
            if (remember) {
                state.savedLogin = { email, password: pass, phone };
            } else {
                state.savedLogin = null;
            }

            let role = 'customer';
            let name = email.split('@')[0];
            name = name.charAt(0).toUpperCase() + name.slice(1);
            let customerCode = '';

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                role = 'admin';
                name = 'Admin Fatin Art';
            } else {
                let existingCust = state.customers.find(c => c.email.toLowerCase() === email);
                if (existingCust) {
                    customerCode = existingCust.code;
                    name = existingCust.name;
                    existingCust.phone = phone; // Update WA aktif terbaru
                } else {
                    customerCode = 'CUST-' + Math.floor(100 + Math.random() * 900);
                    state.customers.push({
                        code: customerCode,
                        name: name,
                        email: email,
                        phone: phone,
                        registeredAt: new Date().toISOString().split('T')[0]
                    });
                }
            }

            state.currentUser = {
                email,
                name,
                role,
                customerCode,
                phone: role === 'customer' ? phone : state.adminWhatsApp
            };

            saveState(state);
            showToast(`Berhasil masuk sebagai ${role === 'admin' ? 'Admin' : 'Pelanggan'}!`, 'success');
            setTimeout(() => { render(); }, 300);
        }

            const state = getState();

            const state = getState();

            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const itemsCopy = [...cart];

            const newOrder = {

            state.orders.unshift(newOrder);

            const invoiceNo = 'INV-' + Math.floor(8000 + Math.random() * 1999);
            state.invoices.unshift({
                invoiceNo: invoiceNo,
                orderId: orderId,
                customerCode: user.customerCode,

                total: total,

            saveState(state);

            let itemsText = itemsCopy.map(i => `- ${i.name} (${i.qty}x @${formatRupiah(i.price)})`).join('%0A');
            let waMessage = `Halo Admin Fatin Art Advertising,%0A%0ASaya ingin memesan produk berikut:%0A*Kode Pelanggan:* ${user.customerCode}%0A*Nama:* ${user.name}%0A*No WA Aktif:* ${user.phone}%0A*ID Pesanan:* ${orderId}%0A%0A*Rincian Pesanan:*%0A${itemsText}%0A%0A*Total:* ${formatRupiah(total)}%0A%0AMohon konfirmasi dan proses pesanan saya. Terima kasih!`;

                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap</label>
                                <input type="text" id="custName" required placeholder="Bpk. Ahmad" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nomor WhatsApp Aktif</label>
                                <input type="text" id="custPhone" required placeholder="08123456789" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email Pelanggan</label>
                                <input type="email" id="custEmail" required placeholder="ahmad@gmail.com" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30">Simpan ke Database</button>
                        </form>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div);
        }

        function saveNewCustomer(e) {
            e.preventDefault();
            const state = getState();
            const code = 'CUST-' + Math.floor(100 + Math.random() * 900);
            state.customers.push({
                code: code,
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                email: document.getElementById('custEmail').value,
                registeredAt: new Date().toISOString().split('T')[0]
            });
            saveState(state);
            closeModal('custModal');
            showToast(`Pelanggan baru ditambahkan dengan kode ${code}`, 'success');
            render();
        }

        function openCreateInvoiceModal() {
            const state = getState();
            const modalHTML = `
                <div id="invModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                            <h3 class="font-bold text-slate-900 text-base">Buat Nota Pembayaran Manual</h3>
                            <button onclick="closeModal('invModal')" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="saveManualInvoice(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Pelanggan</label>
                                <select id="invCustCode" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    ${state.customers.map(c => `<option value="${c.code}">${c.name} (${c.code})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Barang / Layanan</label>
                                <input type="text" id="invItemName" required placeholder="Cetak Banner 3x1" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Jumlah (Qty)</label>
                                    <input type="number" id="invQty" required value="1" min="1" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Harga Satuan (Rp)</label>
                                    <input type="number" id="invPrice" required placeholder="50000" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Status Pembayaran</label>
                                <select id="invStatus" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <option>Lunas</option>
                                    <option>Belum Lunas / Tunai</option>
                                    <option>DP 50%</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Keterangan / Pesan Admin di Nota</label>
                                <textarea id="invNotes" rows="2" placeholder="Terima kasih, pesanan selesai jam 14.00" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">Terima kasih atas pesanan Anda di Fatin Art Advertising.</textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30">Terbitkan Nota Resmi</button>
                        </form>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div);
        }

        function saveManualInvoice(e) {
            e.preventDefault();
            const state = getState();
            const custCode = document.getElementById('invCustCode').value;
            const cust = state.customers.find(c => c.code === custCode);
            const qty = Number(document.getElementById('invQty').value);
            const price = Number(document.getElementById('invPrice').value);
            const total = qty * price;

            const invNo = 'INV-' + Math.floor(8000 + Math.random() * 1999);
            state.invoices.unshift({
                invoiceNo: invNo,
                orderId: 'ORD-MANUAL',
                customerCode: custCode,
                customerName: cust ? cust.name : 'Pelanggan',
                items: [{ name: document.getElementById('invItemName').value, qty, price }],
                total: total,
                status: document.getElementById('invStatus').value,
                notes: document.getElementById('invNotes').value,
                date: new Date().toISOString().split('T')[0]
            });
            saveState(state);
            closeModal('invModal');
            showToast(`Nota ${invNo} berhasil diterbitkan!`, 'success');
            render();
        }

        function openEditInvoiceModal(invoiceNo) {
            const state = getState();
            const inv = state.invoices.find(i => i.invoiceNo === invoiceNo);
            if (!inv) return;

            const modalHTML = `
                <div id="invModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                            <h3 class="font-bold text-slate-900 text-base">Edit Nota: ${inv.invoiceNo}</h3>
                            <button onclick="closeModal('invModal')" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="updateManualInvoice(event, '${inv.invoiceNo}')" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Status Pembayaran</label>
                                <select id="editInvStatus" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <option ${inv.status === 'Lunas' ? 'selected' : ''}>Lunas</option>
                                    <option ${inv.status.includes('Belum') ? 'selected' : ''}>Belum Lunas / Tunai</option>
                                    <option ${inv.status.includes('DP') ? 'selected' : ''}>DP 50%</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Catatan / Keterangan Admin</label>
                                <textarea id="editInvNotes" rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">${inv.notes}</textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30">Simpan Perubahan Nota</button>
                        </form>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div);
        }

        function updateManualInvoice(e, invoiceNo) {
            e.preventDefault();
            const state = getState();
            const inv = state.invoices.find(i => i.invoiceNo === invoiceNo);
            if (inv) {
                inv.status = document.getElementById('editInvStatus').value;
                inv.notes = document.getElementById('editInvNotes').value;
                saveState(state);
                closeModal('invModal');
                showToast('Nota berhasil diperbarui!', 'success');
                render();
            }
        }

        function deleteInvoice(invoiceNo) {
            if (confirm('Hapus nota ini?')) {
                const state = getState();
                state.invoices = state.invoices.filter(i => i.invoiceNo !== invoiceNo);
                saveState(state);
                showToast('Nota dihapus', 'info');
                render();
            }
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
